name: Build XPLC Capture APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build installable debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Name APK
        run: cp app/build/outputs/apk/debug/app-debug.apk XPLC-Capture-v1.0.0.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: XPLC-Capture-v1.0.0
          path: XPLC-Capture-v1.0.0.apk

      - name: Publish downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 XPLC-Capture-v1.0.0.apk --clobber
          else
            gh release create v1.0.0 XPLC-Capture-v1.0.0.apk \
              --title "XPLC Capture v1.0.0" \
              --notes "Android internal playback capture. Saves trimmed WAV recordings to Music/XPLC Capture. Uses Android MediaProjection and AudioPlaybackCapture; source apps may block capture."
          fi
